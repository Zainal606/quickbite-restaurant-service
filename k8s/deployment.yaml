apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: quickbite
  labels:
    app: restaurant-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: restaurant-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      containers:
        - name: restaurant-service
          image: quickbite/restaurant-service:1.0
          # The image is built locally and loaded into minikube, not pulled.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: restaurant-db-secret, key: POSTGRES_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: restaurant-db-secret, key: POSTGRES_PASSWORD}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: restaurant-db-secret, key: POSTGRES_DB}}
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(DB_USER):$(DB_PASSWORD)@restaurant-db:5432/$(DB_NAME)
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: quickbite
  labels:
    app: restaurant-service
spec:
  type: NodePort
  selector:
    app: restaurant-service
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30081
